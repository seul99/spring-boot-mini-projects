<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 상세 페이지</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fc;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .container h1 {
            color: #4A90E2;
            margin-bottom: 15px;
        }

        .text {
            text-align: left;
            margin-bottom: 10px;
        }

        .content-box {
            width: 100%;
            min-height: 200px;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ddd;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
            overflow-y: auto;
            background-color: #f9f9f9;
            text-align: left;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .btn {
            display: inline-block;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            text-align: center;
            color: white;
            transition: 0.3s;
        }

        .delete-button { background-color: #dc3545; }
        .modify-button { background-color: #28a745; }
        .img-button { background-color: #ffc107; color: black; }

        .delete-button:hover { background-color: #c82333; }
        .modify-button:hover { background-color: #218838; }
        .img-button:hover { background-color: #e0a800; }

    </style>
</head>
<body>
<div class="container">
    <h1>게시글 상세 페이지</h1>

    <p class="text"><strong>게시물 번호 :</strong> <span th:text="${board.id}">1</span></p>
    <p class="text"><strong>제목 :</strong> <span th:text="${board.title}">제목입니다.</span></p>
    <br>
    <p class="text"><strong>내용</strong></p>
    <div class="content-box" th:text="${board.content}">내용이 들어갈 부분입니다.</div>

    <div class="btn-group">
        <a th:href="@{/board/delete(id=${board.id})}" class="btn delete-button">글 삭제</a>
        <a th:href="@{/board/modify/{id}(id=${board.id})}" class="btn modify-button">수정</a>
        <a th:href="@{${board.filepath}}" class="btn img-button">이미지 확인</a>
    </div>
</div>
</body>
</html>
