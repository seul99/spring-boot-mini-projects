<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시물 작성폼</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fc;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .container h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #4A90E2;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group input, .form-group textarea, .form-group button {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ddd;
            font-size: 16px;
            margin-top: 10px;
        }

        .form-group input[type="file"] {
            padding: 3px;
            cursor: pointer;
        }

        .form-group button {
            background-color: #4A90E2;
            color: white;
            border: none;
            cursor: pointer;
        }

        .form-group button:hover {
            background-color: #357ABD;
        }

        .form-group label {
            font-weight: bold;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 200px;
        }

        .form-group input[type="text"] {
            height: 40px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>게시물 작성</h1>
    <form action="/board/writepro" method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label for="title">제목</label>
            <input type="text" name="title" id="title" placeholder="제목을 입력하세요" required>
        </div>

        <div class="form-group">
            <label for="content">내용</label>
            <textarea name="content" id="content" placeholder="내용을 입력하세요" required></textarea>
        </div>

        <div class="form-group">
            <label for="file">파일 첨부</label>
            <input type="file" name="file" id="file">
        </div>

        <div class="form-group">
            <button type="submit">작성</button>
        </div>
    </form>
</div>

</body>
</html>
